include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

# Pre-create the queues so SCAN_QUEUE_URL / STRATEGY_QUEUE_URL are stable.
queues {
  scan-queue {}
  strategy-queue {}
}
