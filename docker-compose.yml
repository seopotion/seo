services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Local SQS-compatible queue for the scan pipeline.
  sqs:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324" # SQS endpoint
      - "9325:9325" # web UI
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

volumes:
  mongo-data:
