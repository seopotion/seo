name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify checkout
        run: |
          pwd
          test -f package.json
          test -f package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck (root + web)
        run: npm run check:all

      - name: Unit tests
        run: npm test

  # Free-tier stand-in for "require branches to be up to date before merging"
  # (rulesets need GitHub Team on a private repo): fail the PR when its branch
  # is behind the base. Not enforced — a red check is a signal, not a block —
  # and it only re-runs on PR events, so a PR can still go stale after going
  # green. Uses the compare API, so no checkout or history depth needed.
  # Skipped for release PRs (dev -> master): master carries the merge commits
  # of every earlier release, which dev never gets back, so it always reads as
  # "behind" there — release PRs are ahead of master by construction.
  up-to-date:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the PR branch is behind its base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" --jq .behind_by)
          echo "behind ${BASE} by ${behind} commit(s)"
          if [ "$behind" -gt 0 ]; then
            echo "::error::Branch is ${behind} commit(s) behind ${BASE} — merge ${BASE} into it (or use 'Update branch') and push."
            exit 1
          fi
