name: Deploy backend

# Branch/event → environment: merging `dev` → `master` deploys staging. Pushes to
# `dev` deploy nothing (integration only). Publishing a GitHub Release deploys
# prod (#43) — releases are cut from `master`, i.e. from a commit staging has
# already run, which the prod job asserts before touching AWS.
on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/shared/**'
      - 'scripts/lambda-db-init.ts'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  release:
    types: [published]

permissions:
  id-token: write # for OIDC
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One staging deploy at a time.
    concurrency:
      group: deploy-backend-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install root deps (for preflight CLI)
        run: npm ci

      - name: Preflight — verify deploy prerequisites
        env:
          AWS_REGION: us-east-1
          GOOGLE_CLIENT_ID_STAGING: ${{ vars.GOOGLE_CLIENT_ID_STAGING }}
          WEB_ORIGIN_STAGING: ${{ vars.WEB_ORIGIN_STAGING }}
          LEMONSQUEEZY_STORE_ID_STAGING: ${{ vars.LEMONSQUEEZY_STORE_ID_STAGING }}
          LEMONSQUEEZY_VARIANT_PAID_STAGING: ${{ vars.LEMONSQUEEZY_VARIANT_PAID_STAGING }}
          LEMONSQUEEZY_VARIANT_EXPERT_STAGING: ${{ vars.LEMONSQUEEZY_VARIANT_EXPERT_STAGING }}
        run: npm run cli -- infra preflight --stage staging --output json

      - name: Install infra deps
        run: cd infra && npm ci

      - name: CDK deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          GOOGLE_CLIENT_ID_STAGING: ${{ vars.GOOGLE_CLIENT_ID_STAGING }}
          # GSC OAuth redirect URI base, baked into the API Lambda at synth time
          # (infra/lib/config.ts webOrigin; preflight above verifies it's set).
          WEB_ORIGIN_STAGING: ${{ vars.WEB_ORIGIN_STAGING }}
          # LemonSqueezy public config (#13), baked into the API Lambda at synth
          # time (infra/lib/config.ts; preflight above verifies they're set).
          LEMONSQUEEZY_STORE_ID_STAGING: ${{ vars.LEMONSQUEEZY_STORE_ID_STAGING }}
          LEMONSQUEEZY_VARIANT_PAID_STAGING: ${{ vars.LEMONSQUEEZY_VARIANT_PAID_STAGING }}
          LEMONSQUEEZY_VARIANT_EXPERT_STAGING: ${{ vars.LEMONSQUEEZY_VARIANT_EXPERT_STAGING }}
          # GitHub App public config (#7), baked into the API Lambda at synth
          # time. Unset until the App is registered by hand (design/github-app.md
          # § Registration) — the install-url route 503s until then, so preflight
          # deliberately does not assert these yet.
          GITHUB_APP_SLUG_STAGING: ${{ vars.GITHUB_APP_SLUG_STAGING }}
          GITHUB_APP_CLIENT_ID_STAGING: ${{ vars.GITHUB_APP_CLIENT_ID_STAGING }}
          # Provider API keys are no longer passed here: they live in per-stage
          # SSM SecureStrings resolved at Lambda runtime (#43), and the preflight
          # above verifies they exist.
        run: cd infra && npx cdk deploy SeoApiStack-staging --require-approval never

  deploy-prod:
    # Prereleases are for testing a tag, not for shipping — they must not deploy.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    # The `prod` environment carries NO protection rules — required reviewers need
    # a paid plan for private repos. It is declared for what it does give us: the
    # OIDC token's subject becomes `repo:seopotion/seo:environment:prod`, which is
    # what the deploy role's trust policy scopes to (see infra/ENVIRONMENTS.md).
    # The human gate is the act of publishing the Release itself — there is no
    # approval step, so a published Release deploys straight through.
    environment: prod
    # One prod deploy at a time; never cancel one mid-flight.
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ancestry check below can see master.
          fetch-depth: 0

      # Prod ships only code staging has already run. GitHub will happily tag any
      # ref, so verify the released commit is actually on master before we hold
      # any AWS credentials.
      - name: Verify the release commit is on master
        run: |
          git fetch --no-tags --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release ${{ github.event.release.tag_name }} points at $GITHUB_SHA, which is not an ancestor of master. Cut releases from master so prod ships staging-verified code."
            exit 1
          fi
          echo "$GITHUB_SHA is on master — proceeding."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install root deps (for preflight CLI)
        run: npm ci

      - name: Preflight — verify deploy prerequisites
        env:
          AWS_REGION: us-east-1
          GOOGLE_CLIENT_ID_PROD: ${{ vars.GOOGLE_CLIENT_ID_PROD }}
          WEB_ORIGIN_PROD: ${{ vars.WEB_ORIGIN_PROD }}
          LEMONSQUEEZY_STORE_ID_PROD: ${{ vars.LEMONSQUEEZY_STORE_ID_PROD }}
          LEMONSQUEEZY_VARIANT_PAID_PROD: ${{ vars.LEMONSQUEEZY_VARIANT_PAID_PROD }}
          LEMONSQUEEZY_VARIANT_EXPERT_PROD: ${{ vars.LEMONSQUEEZY_VARIANT_EXPERT_PROD }}
        run: npm run cli -- infra preflight --stage prod --output json

      - name: Install infra deps
        run: cd infra && npm ci

      - name: CDK deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          GOOGLE_CLIENT_ID_PROD: ${{ vars.GOOGLE_CLIENT_ID_PROD }}
          # GSC OAuth redirect URI base, baked into the API Lambda at synth time
          # (infra/lib/config.ts webOrigin; preflight above verifies it's set).
          # Points at the intended prod origin even though the frontend is not
          # hosted yet (#35) — GSC OAuth stays unexercisable until it is.
          WEB_ORIGIN_PROD: ${{ vars.WEB_ORIGIN_PROD }}
          # LemonSqueezy public config (#13), baked into the API Lambda at synth
          # time (infra/lib/config.ts; preflight above verifies they're set).
          LEMONSQUEEZY_STORE_ID_PROD: ${{ vars.LEMONSQUEEZY_STORE_ID_PROD }}
          LEMONSQUEEZY_VARIANT_PAID_PROD: ${{ vars.LEMONSQUEEZY_VARIANT_PAID_PROD }}
          LEMONSQUEEZY_VARIANT_EXPERT_PROD: ${{ vars.LEMONSQUEEZY_VARIANT_EXPERT_PROD }}
          # GitHub App public config (#7) — unset until the App is registered by
          # hand; the install-url route 503s until then.
          GITHUB_APP_SLUG_PROD: ${{ vars.GITHUB_APP_SLUG_PROD }}
          GITHUB_APP_CLIENT_ID_PROD: ${{ vars.GITHUB_APP_CLIENT_ID_PROD }}
        run: cd infra && npx cdk deploy SeoApiStack-prod --require-approval never
